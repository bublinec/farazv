name: Remake checks

on:
  pull_request:
    paths:
      - "remake/**"
      - ".github/workflows/remake-checks.yml"
  push:
    paths:
      - "remake/**"
      - ".github/workflows/remake-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remake-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only-local-postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: remake
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      CONTENT_SOURCE: fixtures
      SITE_INDEXING_ENABLED: "false"
      PREVIEW_DATE: "2026-10-31"
      TEST_POSTGRES_URL: postgresql://postgres:ci-test-only-local-postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      # Official release commits verified 2026-10-31; no floating action references.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: remake/.nvmrc
          cache: npm
          cache-dependency-path: remake/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Formatting, route types, TypeScript and unit tests
        run: npm run check
      - name: Production build with public fixtures
        run: npm run build
      - name: Install Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Public browser flows with explicit fixtures
        run: npm run test:browser -- tests/browser/public.spec.ts tests/browser/static-content.spec.ts tests/browser/details.spec.ts
      - name: Automated accessibility checks with public fixtures
        run: npm run test:accessibility
      - name: Real PostgreSQL publication and import contracts
        run: npm run test:integration
      - name: Authenticated admin flows in an isolated local database
        run: npm run test:admin
