name: Clean production build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      COREPACK_ENABLE_AUTO_PIN: "0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      GATSBY_TELEMETRY_DISABLED: "1"
      YARN_ENABLE_TELEMETRY: "0"

    steps:
      - name: Prepare diagnostic logs
        run: mkdir -p "$RUNNER_TEMP/farazv-build-logs"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Use the same pinned Node version as Netlify.
      - name: Set up Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Set up diagnostic Yarn version
        run: |
          node --version | tee "$RUNNER_TEMP/farazv-build-logs/environment.log"
          corepack --version | tee -a "$RUNNER_TEMP/farazv-build-logs/environment.log"
          corepack enable
          corepack prepare yarn@4.9.2 --activate
          yarn --version | tee -a "$RUNNER_TEMP/farazv-build-logs/environment.log"
          git rev-parse HEAD | tee -a "$RUNNER_TEMP/farazv-build-logs/environment.log"

      - name: Install from the committed lockfile
        run: yarn install --immutable --inline-builds 2>&1 | tee "$RUNNER_TEMP/farazv-build-logs/install.log"

      - name: Build production site
        env:
          NODE_ENV: production
        run: yarn build 2>&1 | tee "$RUNNER_TEMP/farazv-build-logs/build.log"

      - name: Verify generated site and deployment marker
        run: |
          test -s public/index.html
          test -s public/deploy-check.txt
          cmp static/deploy-check.txt public/deploy-check.txt
          cat public/deploy-check.txt | tee "$RUNNER_TEMP/farazv-build-logs/deploy-check.txt"
          git diff --exit-code -- package.json yarn.lock

      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/farazv-build-logs/
          if-no-files-found: warn
          retention-days: 14
