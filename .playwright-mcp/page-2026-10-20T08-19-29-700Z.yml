        - generic [ref=f4e1522]:
          - generic [ref=f4e1524]:
            - generic [ref=f4e1525]: Farské oznamy
            - heading "Oznamy" [level=2] [ref=f4e1526]
          - generic [ref=f4e1531]:
            - generic [ref=f4e1532]: ✓
            - list [ref=f4e1534]:
              - listitem [ref=f4e1535]: Dnes, v nedeľu – 18. októbra, slávime Misijnú nedeľu. Po svätých omšiach sa bude konať zbierka na misie. Tento rok je určená pre farnosti a diecézy v africkej krajine Burundi. Svojím príspevkom dávame chudobným nádej a pomáhame im žiť lepší život. Za všetky milodary vyslovujeme srdečné Pán Boh zaplať. Milodar budete môcť vložiť do označených pokladničiek vzadu za lavicami v kostole i v kaplnke.
              - listitem [ref=f4e1536]: "Pri príležitosti stého výročia Svetového dňa misií Apoštolská penitenciária rozhodla o udelení úplných odpustkov, ktoré možno privlastniť aj dušiam zosnulých veriacich, všetkým veriacim, ktorí pri príležitosti tohto slávenia pristúpia k svätému prijímaniu a obetujú modlitby za šírenie evanjelia po celom svete. Na získanie úplných odpustkov je okrem vykonania predpísaného skutku potrebné splniť tieto podmienky: Sviatostná spoveď, sväté prijímanie, modlitba na úmysel Svätého Otca a vnútorné odpútanie sa od každého hriechu. Sviatostnú spoveď možno vykonať niekoľko dní pred vykonaním predpísaného skutku alebo po ňom. Je však vhodné pristúpiť k svätému prijímaniu a pomodliť sa na úmysel Svätého Otca v ten istý deň, v ktorom sa vykonáva skutok spojený s možnosťou získať odpustky."
          - generic [ref=f4e1537]:
            - generic [ref=f4e1538]: ✓
            - list [ref=f4e1540]:
              - listitem [ref=f4e1541]: Vo štvrtok 22. októbra si v Lieskovci pripomenieme sv. omšou o 18.00hod. patróna chrámu sv. Jána Pavla II., pápeža, preto v piatok už sv. omša v Lieskovci nebude. Túto slávnosť si však ešte v Lieskovci prenesieme na nedeľu. Všetkých pozývame na slávnostnú sv. omšu i spoločné agapé po nej pred kostolom.
          - generic [ref=f4e1542]:
            - generic [ref=f4e1543]: ✓
            - list [ref=f4e1545]:
              - listitem [ref=f4e1546]: Vo štvrtok 22. októbra po večernej svätej omši bude pobožnosť ku cti sv. Šarbela. Svoje krátke modlitebné úmysly za uzdravenie môžete napísať do knihy prosieb v kostole pri obraze sv. Šarbela alebo napísať do on-line formuláru, ktorý nájdete na farskej stránke.
          - generic [ref=f4e1547]:
            - generic [ref=f4e1548]: ✓
            - list [ref=f4e1550]:
              - listitem [ref=f4e1551]: V piatok 23. októbra po večernej svätej omši, ktorá bude pre birmovancov, bude stretnutie rodičov prvoprijímajúcich detí v kostole svätej Alžbety vo Zvolene. Účasť aspoň jedného rodiča je nutná.
          - generic [ref=f4e1552]:
            - generic [ref=f4e1553]: ✓
            - list [ref=f4e1555]:
              - listitem [ref=f4e1556]: O týždeň, v noci z 24. na 25. októbra, sa mení čas. O 3.00 hodine letného času posúvame hodiny na 02.00 hodinu stredoeurópskeho času.
          - generic [ref=f4e1557]:
            - generic [ref=f4e1558]: ✓
            - list [ref=f4e1560]:
              - listitem [ref=f4e1561]: Občianske združenie Fórum života organizuje kampaň Sviečka za nenarodené deti. Pozýva spomenúť si na nenarodené deti a zapáliť sviečku ako tichú spomienku v nežnom plameni. Sviečka scitlivuje spoločnosť, aby sme vnímali bolesť a smútok tých, ktorí o svoje bábätká prišli pred ich narodením, dodávali im nádej a pomáhali liečiť ubolené srdcia. V našom kostole si môžete zakúpiť sviečku za nenarodené deti v cene 2€ za malú sviečku a 5€ za veľkú v skle. Peniaze môžete vhodiť do pokladničky pri platobnom termináli v hl. lodi.
          - generic [ref=f4e1562]:
            - generic [ref=f4e1563]: ✓
            - list [ref=f4e1565]:
              - listitem [ref=f4e1566]: "Kňazský seminár sv. Františka Xaverského vydal knihu: Archívna história banskobystrického kňazského seminára ktorej autorom je Mons. Vojtech Nepšinský. Zakúpiť si ju môžete v našom kostole za 10€"
