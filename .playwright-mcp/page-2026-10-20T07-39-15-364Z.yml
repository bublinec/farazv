            - link "Naše spoločenstvo Nový farský vikár Redakcia 9. októbra 2024 Milí čitatelia časopisu Naše spoločenstvo, všetkých vás srdečne pozdravujem. Som veľmi rád, že po roku môžem opäť do tohto časopisu napísať už nie ako diakon, ale ako zvolenský kaplán, čo ma napĺňa veľkou radosťou, pretože zvolenská farnosť sa mi za rok diakonskej služby stala druhým domov. Nie darmo sa zvykne hovoriť o prvom pôsobisku ako o „prvej pastoračnej láske“ – a v tomto prípade to platí dvojnásobne, prvýkrát ako diakon a teraz ako váš kaplán. Od redaktorky mesta som dostal pár otázok, na ktoré rád odpovedám." [ref=f1e789] [cursor=pointer]:
