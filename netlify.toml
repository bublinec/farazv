[build]
  # Keep Netlify's automatic dependency installer separate from the app.
  # The shared build script installs the exact toolchain and builds at repo root.
  base = "netlify-build"
  command = "bash ../scripts/netlify-build.sh"
  publish = "../public"

[build.environment]
  # This Gatsby site is fully static; no generated API, SSR or DSG functions.
  NETLIFY_SKIP_GATSBY_BUILD_PLUGIN = "true"
