# Preserve the last legacy deployment as a migration fallback.
# The active website is built and deployed by Vercel from the repository root.
[build]
  base = "old/client/netlify-build"
  command = "bash ../scripts/netlify-build.sh"
  publish = "../public"
  ignore = "exit 0"

[build.environment]
  NETLIFY_SKIP_GATSBY_BUILD_PLUGIN = "true"
