name: Clean production build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      COREPACK_ENABLE_AUTO_PIN: "0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      GATSBY_TELEMETRY_DISABLED: "1"
      YARN_ENABLE_TELEMETRY: "0"

    steps:
      - name: Prepare diagnostic logs
        run: mkdir -p "$RUNNER_TEMP/farazv-build-logs"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Use the same pinned Node version as Netlify.
      - name: Set up Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Record source revision
        run: |
          git rev-parse HEAD | tee "$RUNNER_TEMP/farazv-build-logs/environment.log"

      - name: Install and build using the Netlify script
        run: bash scripts/netlify-build.sh 2>&1 | tee "$RUNNER_TEMP/farazv-build-logs/build.log"

      - name: Verify dependency files remain unchanged
        run: |
          cat public/deploy-check.txt | tee "$RUNNER_TEMP/farazv-build-logs/deploy-check.txt"
          git diff --exit-code -- package.json yarn.lock

      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/farazv-build-logs/
          if-no-files-found: warn
          retention-days: 14
